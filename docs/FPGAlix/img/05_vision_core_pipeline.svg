<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1450" height="600" fill="#ffffff"/>

  <!-- Camera + driver, feeding the capture thread from above -->
  <rect x="10" y="15" width="170" height="50" rx="8" fill="#fafafa" stroke="#888"/>
  <text x="95" y="45" text-anchor="middle" font-size="14">Camera</text>
  <line x1="95" y1="65" x2="95" y2="83" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="10" y="85" width="170" height="95" rx="8" fill="#fafafa" stroke="#888"/>
  <text x="95" y="120" text-anchor="middle" font-size="13">camera_driver_2</text>
  <text x="95" y="138" text-anchor="middle" font-size="11" fill="#555">V4L2 kernel driver</text>
  <line x1="95" y1="180" x2="95" y2="198" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1. Capture thread -->
  <rect x="10" y="200" width="190" height="170" rx="10" fill="#fff2a8" stroke="#c9a227"/>
  <text x="105" y="270" text-anchor="middle" font-size="15">Capture thread</text>
  <text x="105" y="290" text-anchor="middle" font-size="12" font-style="italic">(Capturer class)</text>

  <!-- 2. Input buffer -->
  <rect x="290" y="200" width="160" height="170" rx="10" fill="#fafafa" stroke="#888"/>
  <text x="370" y="270" text-anchor="middle" font-size="14">Input buffer</text>
  <text x="370" y="288" text-anchor="middle" font-size="12" font-style="italic">(FrameBuffer class)</text>
  <text x="370" y="304" text-anchor="middle" font-size="11" fill="#555">raw frames</text>

  <!-- 3. Processing thread, split into thread body + filter list -->
  <rect x="540" y="200" width="210" height="100" rx="10" fill="#b9eab9" stroke="#3a8f3a"/>
  <text x="645" y="245" text-anchor="middle" font-size="15">Processing thread</text>
  <text x="645" y="265" text-anchor="middle" font-size="12" font-style="italic">(Processor class)</text>
  <rect x="540" y="300" width="210" height="70" rx="0" fill="#e3f5e3" stroke="#3a8f3a"/>
  <text x="645" y="326" text-anchor="middle" font-size="12">filter list</text>
  <text x="645" y="343" text-anchor="middle" font-size="10" fill="#555">pending &#8594; active, on commit()</text>
  <path d="M 540 300 h 210" stroke="#3a8f3a" stroke-width="1"/>
  <rect x="540" y="200" width="210" height="170" rx="10" fill="none" stroke="#3a8f3a"/>

  <!-- 4. Output buffer -->
  <rect x="840" y="200" width="160" height="170" rx="10" fill="#fafafa" stroke="#888"/>
  <text x="920" y="270" text-anchor="middle" font-size="14">Output buffer</text>
  <text x="920" y="288" text-anchor="middle" font-size="12" font-style="italic">(FrameBuffer class)</text>
  <text x="920" y="304" text-anchor="middle" font-size="11" fill="#555">processed frames</text>

  <!-- 5. Transmit block: one external subsystem, two threads inside -->
  <rect x="1090" y="200" width="240" height="38" rx="10" fill="#fafafa" stroke="#555"/>
  <rect x="1090" y="228" width="240" height="10" fill="#fafafa"/>
  <text x="1210" y="216" text-anchor="middle" font-size="13">Streamer class</text>
  <text x="1210" y="231" text-anchor="middle" font-size="10" fill="#555">GStreamer + RTSP server</text>

  <rect x="1090" y="238" width="240" height="66" fill="#b8eef2" stroke="none"/>
  <text x="1210" y="266" text-anchor="middle" font-size="14">tx thread</text>
  <text x="1210" y="283" text-anchor="middle" font-size="10" fill="#555">pushes frames to GstAppSrc</text>

  <line x1="1090" y1="304" x2="1330" y2="304" stroke="#555" stroke-width="1"/>

  <rect x="1090" y="304" width="240" height="66" fill="#f1c6ea" stroke="none"/>
  <text x="1210" y="332" text-anchor="middle" font-size="14">gst-loop thread</text>
  <text x="1210" y="349" text-anchor="middle" font-size="10" fill="#555">GLib main loop, RTSP sessions</text>

  <rect x="1090" y="200" width="240" height="170" rx="10" fill="none" stroke="#555" stroke-width="1.5"/>

  <line x1="1330" y1="271" x2="1370" y2="271" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1375" y="266" font-size="11" fill="#555">RTSP</text>
  <text x="1375" y="279" font-size="11" fill="#555">client(s)</text>

  <!-- Capture thread <-> Input buffer -->
  <line x1="200" y1="248" x2="288" y2="248" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="240" text-anchor="middle" font-size="10">push(frame)</text>
  <line x1="288" y1="322" x2="200" y2="322" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="337" text-anchor="middle" font-size="10">borrow()</text>

  <!-- Input buffer <-> Processing thread -->
  <line x1="450" y1="248" x2="538" y2="248" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="240" text-anchor="middle" font-size="10">pop()</text>
  <line x1="538" y1="322" x2="450" y2="322" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="337" text-anchor="middle" font-size="10">giveBack()</text>

  <!-- Processing thread <-> Output buffer -->
  <line x1="750" y1="248" x2="838" y2="248" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="240" text-anchor="middle" font-size="10">push(frame)</text>
  <line x1="838" y1="322" x2="750" y2="322" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="337" text-anchor="middle" font-size="10">borrow()</text>

  <!-- Output buffer <-> tx thread -->
  <line x1="1000" y1="256" x2="1088" y2="256" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1044" y="248" text-anchor="middle" font-size="10">pop()</text>
  <line x1="1088" y1="288" x2="1000" y2="288" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1044" y="303" text-anchor="middle" font-size="10">giveBack()</text>

  <!-- SimpleUI, one-directional: it only calls into the Processor -->
  <rect x="540" y="440" width="210" height="100" rx="10" fill="#ffd9a8" stroke="#c97a1a"/>
  <text x="645" y="480" text-anchor="middle" font-size="15">SimpleUI thread</text>
  <text x="645" y="500" text-anchor="middle" font-size="12" font-style="italic">(SimpleUI class)</text>
  <text x="645" y="518" text-anchor="middle" font-size="10" fill="#555">reads filter commands from stdin</text>

  <line x1="645" y1="440" x2="645" y2="372" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="405" font-size="10" fill="#555">appendFilter() / clearAllFilters()</text>
  <text x="660" y="420" font-size="10" fill="#555">commit()</text>

  <text x="10" y="575" font-size="11" font-style="italic" fill="#555">OV7670 path: camera_driver_2 is a custom driver with DMA-based capture (04. camera_driver_2).</text>

</svg>
