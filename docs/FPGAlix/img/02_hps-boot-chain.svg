<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- boxes -->
  <g font-size="15" text-anchor="middle">

    <!-- Row 1, left to right -->

    <!-- 1. Reset -->
    <rect x="10" y="15" width="180" height="110" rx="10" fill="#f2f2f2" stroke="#888"/>
    <text x="100" y="60"><tspan x="100" dy="0">Reset</tspan><tspan x="100" dy="20" font-size="12" fill="#555">BSEL[2:0] sampled</tspan></text>

    <!-- 2. Boot ROM -->
    <rect x="230" y="15" width="180" height="110" rx="10" fill="#d9d9d9" stroke="#888"/>
    <text x="320" y="53"><tspan x="320" dy="0">Boot ROM</tspan><tspan x="320" dy="20" font-size="12" fill="#555">fixed, on-chip</tspan><tspan x="320" dy="16" font-size="12" fill="#555">reads boot source</tspan></text>

    <!-- 3. SD card partition 3 -->
    <rect x="450" y="15" width="200" height="130" rx="10" fill="#f2f2f2" stroke="#888"/>
    <text x="550" y="53"><tspan x="550" dy="0">SD Card</tspan><tspan x="550" dy="18" font-size="12" fill="#555">Partition 3 (A2, raw)</tspan><tspan x="550" dy="18" font-size="12" fill="#555">u-boot-with-spl.sfp</tspan></text>

    <!-- 4. SPL -->
    <rect x="690" y="15" width="200" height="130" rx="10" fill="#2ca02c" stroke="#1e7a1e"/>
    <text x="790" y="53" fill="#fff"><tspan x="790" dy="0">SPL</tspan><tspan x="790" dy="18" font-size="12">on-chip RAM</tspan><tspan x="790" dy="16" font-size="12">clocks · pinmux · DDR init</tspan></text>

    <!-- Row 2, right to left: U-Boot sits directly under SPL -->

    <!-- 5. U-Boot -->
    <rect x="700" y="200" width="180" height="110" rx="10" fill="#2ca02c" stroke="#1e7a1e"/>
    <text x="790" y="245" fill="#fff"><tspan x="790" dy="0">U-Boot</tspan><tspan x="790" dy="20" font-size="12">runs in DDR</tspan></text>

    <!-- 6. FPGA Manager -->
    <rect x="450" y="200" width="210" height="130" rx="10" fill="#f2f2f2" stroke="#888"/>
    <text x="555" y="232"><tspan x="555" dy="0">FPGA Manager</tspan><tspan x="555" dy="20" font-size="12" fill="#555">loads soc_system.rbf</tspan><tspan x="555" dy="16" font-size="12" fill="#555">programs fabric,</tspan><tspan x="555" dy="16" font-size="12" fill="#555">enables H2F/F2H bridges</tspan></text>

    <!-- 7. Linux kernel -->
    <rect x="210" y="200" width="200" height="110" rx="10" fill="#2ca02c" stroke="#1e7a1e"/>
    <text x="310" y="238" fill="#fff"><tspan x="310" dy="0">Linux Kernel</tspan><tspan x="310" dy="20" font-size="12">zImage + DTB</tspan><tspan x="310" dy="16" font-size="12">ext4 rootfs (partition 2)</tspan></text>

  </g>

  <!-- arrows -->
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <!-- row 1, left to right -->
    <line x1="192" y1="75" x2="228" y2="75"/>
    <line x1="412" y1="75" x2="448" y2="75"/>
    <line x1="652" y1="75" x2="688" y2="75"/>
    <!-- wrap: SPL straight down into U-Boot, directly below it -->
    <line x1="790" y1="145" x2="790" y2="198"/>
    <!-- row 2, right to left -->
    <line x1="698" y1="260" x2="662" y2="260"/>
    <line x1="448" y1="260" x2="412" y2="260"/>
  </g>
</svg>
