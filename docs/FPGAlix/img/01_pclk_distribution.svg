<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowPclk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <marker id="arrowReset" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="760" fill="#ffffff"/>

  <!-- ================= OV7670 (physical, off-board) ================= -->
  <rect x="350" y="20" width="200" height="60" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.8"/>
  <text x="450" y="45" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">OV7670</text>
  <text x="450" y="63" font-size="11" fill="#495057" text-anchor="middle">off-board, generates PCLK</text>

  <!-- PCLK in -->
  <line x1="400" y1="80" x2="400" y2="138" stroke="#e8590c" stroke-width="3" marker-end="url(#arrowPclk)"/>
  <text x="388" y="95" font-size="12" fill="#8a3800" text-anchor="end">PCLK, via camera adapter</text>
  <text x="388" y="111" font-size="12" fill="#8a3800" text-anchor="end">(Chapter 2) → GPIO_0(1)</text>

  <!-- camera_reset_n: same condition as pclk_reset_n below, straight out of the top of the controller -->
  <line x1="530" y1="138" x2="530" y2="82" stroke="#868e96" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowGray)"/>
  <text x="543" y="103" font-size="12" fill="#495057">camera_reset_n</text>
  <text x="543" y="119" font-size="12" fill="#495057">(sys_reset_n &amp; sw_release)</text>

  <!-- ================= pclk_reset_controller_0 ================= -->
  <rect x="250" y="140" width="400" height="110" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.8"/>
  <text x="450" y="168" font-size="15" font-weight="bold" fill="#8a3800" text-anchor="middle">★ pclk_reset_controller_0</text>
  <text x="450" y="192" font-size="12" fill="#8a3800" text-anchor="middle">pclk_in → pclk_out (global clock buffer)</text>
  <text x="450" y="212" font-size="12" fill="#8a3800" text-anchor="middle">pclk_reset_n: 2-FF sync, async assert / sync deassert</text>
  <text x="450" y="234" font-size="10.5" fill="#495057" text-anchor="middle">register access (sw_release) from sys_clk, Section 4.2</text>

  <!-- ================= pclk_out / pclk_reset_n fan-out (same reset condition as camera_reset_n above) ================= -->
  <line x1="420" y1="250" x2="420" y2="345" stroke="#e8590c" stroke-width="3"/>
  <line x1="480" y1="250" x2="480" y2="345" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4"/>

  <line x1="150" y1="345" x2="750" y2="345" stroke="#e8590c" stroke-width="3"/>
  <line x1="150" y1="357" x2="750" y2="357" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4"/>

  <line x1="150" y1="345" x2="150" y2="418" stroke="#e8590c" stroke-width="3" marker-end="url(#arrowPclk)"/>
  <line x1="162" y1="357" x2="162" y2="418" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>

  <line x1="440" y1="345" x2="440" y2="418" stroke="#e8590c" stroke-width="3" marker-end="url(#arrowPclk)"/>
  <line x1="452" y1="357" x2="452" y2="418" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>

  <line x1="738" y1="345" x2="738" y2="418" stroke="#e8590c" stroke-width="3" marker-end="url(#arrowPclk)"/>
  <line x1="726" y1="357" x2="726" y2="418" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>

  <!-- ================= destinations ================= -->
  <rect x="30" y="420" width="260" height="100" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.8"/>
  <text x="160" y="450" font-size="13.5" font-weight="bold" fill="#8a3800" text-anchor="middle">★ ov7670_data_interface_0</text>
  <text x="160" y="470" font-size="11" fill="#8a3800" text-anchor="middle">pclk, reset_n</text>
  <text x="160" y="490" font-size="11" fill="#8a3800" text-anchor="middle">camera acquisition core (Chapter 3)</text>

  <rect x="320" y="420" width="240" height="100" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.8"/>
  <text x="440" y="450" font-size="13.5" font-weight="bold" fill="#8a3800" text-anchor="middle">dc_fifo_0</text>
  <text x="440" y="470" font-size="11" fill="#8a3800" text-anchor="middle">in_clk, in_clk_reset</text>
  <text x="440" y="490" font-size="11" fill="#8a3800" text-anchor="middle">pclk-side of the ST FIFO</text>

  <rect x="600" y="420" width="270" height="100" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.8"/>
  <text x="735" y="450" font-size="13" font-weight="bold" fill="#8a3800" text-anchor="middle">mm_clock_crossing_bridge_0</text>
  <text x="735" y="470" font-size="11" fill="#8a3800" text-anchor="middle">s0_clk, s0_reset</text>
  <text x="735" y="490" font-size="11" fill="#8a3800" text-anchor="middle">pclk-side of the MM bridge</text>

  <!-- ================= Legend ================= -->
  <g transform="translate(60,570)">
    <rect x="0" y="0" width="780" height="120" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.2"/>
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#212529">Legend</text>

    <rect x="16" y="38" width="18" height="14" fill="#fff3e0" stroke="#e8590c"/>
    <text x="42" y="49" font-size="11.5" fill="#212529">pclk domain (camera pixel clock)</text>

    <text x="16" y="70" font-size="14" fill="#212529">★</text>
    <text x="42" y="70" font-size="11.5" fill="#212529">Custom Avalon IP (this project)</text>

    <line x1="330" y1="42" x2="365" y2="42" stroke="#e8590c" stroke-width="3"/>
    <text x="373" y="46" font-size="11.5" fill="#212529">pclk_out (clock net)</text>

    <line x1="330" y1="64" x2="365" y2="64" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="373" y="68" font-size="11.5" fill="#212529">reset net: pclk_reset_n and camera_reset_n are both</text>
    <text x="373" y="84" font-size="11.5" fill="#212529">sys_reset_n &amp; sw_release, direct vs. 2-FF-synchronized</text>

    <text x="16" y="100" font-size="10.5" fill="#495057">The sys_clk side of these blocks (Avalon-ST / Avalon-MM crossing) is covered in later chapters.</text>
  </g>
</svg>
